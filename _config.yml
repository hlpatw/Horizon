theme: jekyll-theme-cayman
title: AIHOT Daily
description: 双语 AI 每日资讯：中文速读，英文原文，背景与影响一页看懂
baseurl: "/Horizon_AIHot"
url: "https://hlpatw.github.io"

# Build settings
markdown: kramdown
future: true
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
